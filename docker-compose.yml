services:
  postgres:
    image: postgres:16-alpine
    container_name: omniroute-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=omniroute
      - POSTGRES_PASSWORD=omniroute_secret
      - POSTGRES_DB=omniroute
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniroute -d omniroute"]
      interval: 5s
      timeout: 5s
      retries: 5

  omniroute-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniroute-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"
      - "20128:20128"
    environment:
      - GATEWAY_LISTEN_ADDR=0.0.0.0:8787
      - GATEWAY_OAUTH_CALLBACK_ADDR=0.0.0.0:20128
      - GATEWAY_CONFIG_FILE=/data/gateway_config.json
      - DATABASE_URL=postgres://omniroute:omniroute_secret@postgres:5432/omniroute?sslmode=disable
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./data:/data

volumes:
  pgdata:
