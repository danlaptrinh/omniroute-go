services:
  omniroute-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniroute-gateway
    restart: unless-stopped
    ports:
      - "8787:8787"
      - "20128:20128"
    environment:
      - GATEWAY_LISTEN_ADDR=0.0.0.0:8787
      - GATEWAY_OAUTH_CALLBACK_ADDR=0.0.0.0:20128
      - GATEWAY_CONFIG_FILE=/data/gateway_config.json
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./data:/data

